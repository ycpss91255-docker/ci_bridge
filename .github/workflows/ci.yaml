name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci-rollup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run shared smoke pipeline
        run: .generic_action/ci-bridge run smoke

      - name: Test bridge contract
        run: .generic_action/test/smoke_test.sh
