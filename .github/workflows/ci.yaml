name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci-rollup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run shared CI pipeline
        run: .ci_bridge/ci-bridge pipeline ci

      - name: Test bridge contract
        run: .ci_bridge/test/contract_test.sh
